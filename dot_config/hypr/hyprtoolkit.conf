# hyprtoolkit palette — match the installer desktop theme (swaync/style.css +
# Hyprland window accent). Consumed by hyprtoolkit apps (hyprlauncher).
# Hot-reloads on save.

background = rgba(1e1e2eff)
base = rgba(252538ff)
alternate_base = rgba(2c2c44ff)
text = rgba(f5f5f5ff)
bright_text = rgba(ffffffff)
link_text = rgba(33ccffff)

# Window border gradient colors (#33ccff -> #00ff99)
accent = rgba(33ccffff)
accent_secondary = rgba(00ff99ff)

# swaync card radius 7 / window rounding 6
rounding_large = 7
rounding_small = 5
