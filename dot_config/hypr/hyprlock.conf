# hyprlock — screen locker (issue #71)
# Auth uses PAM via /etc/pam.d/hyprlock (auth include common-auth).

$font = Monospace

general {
    hide_cursor = true
}

# Animations disabled: the fadeIn keeps presenting frames after lock, and each
# frame re-powers the display against hypridle's post-lock `dpms off`, causing a
# visible on/off/on flicker before it settles. Painting once keeps it clean.
animations {
    enabled = false
}

# Keep suspend-time locking independent of desktop DMA-BUF capture. Screenshot
# capture/blur can leave an NVIDIA explicit-sync fence pending as the driver
# enters suspend, resulting in a live session with black outputs after resume.
background {
    monitor =
    color = rgb(20, 24, 32)
}

# Clock.
label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = $font
    color = rgba(216, 222, 233, 0.95)
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    inner_color = rgba(0, 0, 0, 0.35)
    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    rounding = 12
    font_family = $font
    placeholder_text = <i>Password…</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -40
    halign = center
    valign = center
}
